name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-24.04 runners ship with the Android SDK (ANDROID_HOME); no third-party setup action needed.
      - name: Install SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SM" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Core compiles (pure JVM)
        run: chmod +x gradlew && ./gradlew :core:compileKotlin --no-daemon
      - name: Fetch pinned engines (SHA-256 verified)
        run: bash scripts/fetch-engines.sh
      - name: Build APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Collect output
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/IRAN-GOLD.apk
          (cd output && sha256sum IRAN-GOLD.apk > SHA256.txt && cat SHA256.txt)
      - uses: actions/upload-artifact@v5
        with:
          name: IRAN-GOLD
          path: |
            output/IRAN-GOLD.apk
            output/SHA256.txt
      - name: Publish release (direct APK download for phones)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" output/IRAN-GOLD.apk output/SHA256.txt \
            --title "IRAN GOLD $TAG" \
            --notes "Debug-signed sideload build of commit ${GITHUB_SHA::7}. SHA-256 in SHA256.txt. Not tested on devices yet." \
            --prerelease
