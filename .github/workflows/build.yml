name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Core self-test (pure JVM)
        run: chmod +x gradlew && ./gradlew :core:compileKotlin --no-daemon
      - name: Fetch pinned engines (SHA-256 verified)
        run: bash scripts/fetch-engines.sh
      - name: Build APK
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Collect output
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/IRAN-GOLD.apk
          (cd output && sha256sum IRAN-GOLD.apk > SHA256.txt && cat SHA256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: IRAN-GOLD
          path: |
            output/IRAN-GOLD.apk
            output/SHA256.txt
